<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szinkeveres, eventhandle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <table>
        <tbody>
            <tr>
                <td>Piros:</td>
                <td><input type="range" id="red-range" min="0" max="255" value="0"/></td>
                <td><input type="number" id="red-value" min="0" max="255" value="0"/></td>
            </tr>
            <tr>
                <td>Zöld:</td>
                <td><input type="range" id="green-range" min="0" max="255" value="0"/></td>
                <td><input type="number" id="green-value" min="0" max="255" value="0"/></td>
            </tr>
            <tr>
            </tr>
            <tr>
                <td>Kék:</td>
                <td><input type="range" id="blue-range" min="0" max="255" value="0"/></td>
                <td><input type="number" id="blue-value" min="0" max="255" value="0"/></td>
            </tr>
            <tr>
            </tr>
            <tr>
                <td>Alfa:</td>
                <td><input type="range" id="alpha-range" min="0" max="1" value="1" step="0.01"/></td>
                <td><input type="number" id="alpha-value" min="0" max="1" value="1" step="0.01"/></td>
            </tr>
            <tr>
            </tr>
        </tbody>
    </table>
    <table>
        <tbody>
            <tr>
                <td>Width:</td>
                <td><input type="range" id="width-range" min="0" max="600" value="200" step="5"/></td>
            </tr>
            <tr>
                <td>Height:</td>
                <td><input type="range" id="height-range" min="0" max="400" value="200" step="5"/></td>
            </tr>
            <tr>
                <td>Margin-left:</td>
                <td><input type="range" id="margin-left-range" min="-600" max="600" value="200" step="10"/></td>
            </tr>
            <tr>
                <td>Margin-top:</td>
                <td><input type="range" id="margin-top-range" min="-1000" max="1000" value="200" step="10"/></td>
            </tr>
            <tr>
                <td>Border-radius:</td>
                <td><input type="range" id="border-radius-range" min="-600" max="600" value="200" step="10"/></td>
            </tr>
             <tr>
                <td>Rotate:</td>
                <td><input type="range" id="rotate-range" min="0" max="360" value="0" step="10"/></td>
            </tr>
        </tbody>
    </table>

    <div id="rgb-box"></div>
    

    <script src="function.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async Await</title>
</head>
<body>
    <script>
        const getReceptek = new Promise((resolve, reject) =>{
            setTimeout(() => {
                resolve([82, 329, 854, 12, 78, 124])
                reject("Nem sikerult a receptek lekerdezese") //Nyilvan a resolveot ki kell kommentelni mert a resolve ra megy
            }, 1500);
        })

        
        const recept = id => new Promise((resolve, reject) =>{
            setTimeout((id) => {
                const recept = {
                        id: 12,
                        cim: "Almás pite",
                        kategoria: "sütemény",
                        ido: "120 perc",
                        nehezseg: 2,
                        hozzavalo: ["alma","tojas", "liszt", "tej", "cukor", "fahéj"]
                    }
                resolve(recept)
                
            }, 2000);
        })

        const receptKategoriaSzerint = (kategoria) => new Promise((resolve, reject) =>{
            setTimeout((kategoria) => {
                const sutemenyek = [
                        {id: 12, cim: "Almás pite"},
                        {id: 49, cim: "Aranygaluska"},
                        {id: 145, cim: "Kakaós csiga"}
                    ]
                    resolve(sutemenyek)
            }, 1500);
        })
        
        async function fgv() {
            try{
                const receptek = await getReceptek
                console.log(receptek)

                const egyRecept = await recept(receptek[3])
                console.log(egyRecept)

                const sutemenyek = await receptKategoriaSzerint(egyRecept.kategoria)
                console.log(sutemenyek)
            }
            catch(error){
                console.log("Hiba: " + error)
            }
        }

        fgv()
    </script>
</body>
</html>

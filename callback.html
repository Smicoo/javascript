        //Promiseok kovetkeznek ennek a csomornek az elkerulesere, specialis class (uj tipusnak is tekintheto), igeret arra vonatkozoan hogy mi ezt vegrehajtjuk kapunk ra valaszt, amikor utjara inditjuk bekerul 1 pending allapotba es ez 2 dologgal vegzodhet: vagy fullfilled (sikeres) utana .then() vagy rejected (visszautasitas) .catch() el elkapjuk a hibat (error handling)
